<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:104px;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.tile b{display:block;font-size:18px}.tile.bonus{background:var(--rt);border-color:transparent}

.btn{display:block;width:100%;min-height:54px;border:0;border-radius:14px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;color:#fff;background:var(--r)}

.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.scene{perspective:1000px;margin:12px 0}
.fc{position:relative;height:360px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);border-color:var(--g)}
.big{font-size:32px;font-weight:700;line-height:1.3}.ph{font-size:19px;color:var(--r);margin-top:8px}
.spk{margin-top:12px;min-height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--g);background:var(--gt);color:var(--g);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.row{display:flex;gap:10px}.row .btn{flex:1}
.letters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.lt .cy{font-size:40px;font-weight:700;color:var(--g)}.lt .s{color:var(--r);font-weight:600}.lt .t{font-size:14px;color:var(--mut);margin:4px 0 8px}
.lt .spk{margin:0;min-height:44px;padding:0 16px}

.opt.ok{border-color:var(--g);background:var(--gt)}.opt.no{border-color:var(--r);background:var(--rt)}
.q{font-size:28px;font-weight:700;text-align:center;margin:24px 0 12px}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.tl button,.tl span{min-width:48px;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:26px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.tl.sl span{background:var(--bg)}.tl.ok span{border-color:var(--g);background:var(--gt);color:var(--g)}.tl.no span{border-color:var(--r);background:var(--rt)}.tl button:disabled{opacity:.25}
.mg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.mc{min-height:92px;border-radius:14px;border:2px solid var(--line);background:var(--r);color:#fff;font-size:16px;font-weight:600;font-family:inherit;word-break:break-word;padding:6px;cursor:pointer}.mc.op{background:var(--card);color:var(--fg);border-color:var(--g)}.mc.dn{background:var(--gt);color:var(--g);border-color:var(--g)}

.gh{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;margin:10px 0 0;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
.tl.w button,.tl.w span{font-size:17px;min-width:44px;min-height:48px;padding:0 12px}
